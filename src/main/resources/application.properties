spring.application.name=ms-andesstay-audit
server.port=${SERVER_PORT:8083}

# --- Conexion a PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/andesstay_audit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Kafka (consumer + producer solo para publicar en el DLT) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=audit-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Debe coincidir con "reservations.kafka.topic" en ms-andesstay-reservations.
audit.kafka.topic=reservations.events
# Mensajes que fallan tras los reintentos van a "<topic>.audit.DLT".
audit.kafka.dlt-suffix=.audit.DLT
audit.kafka.retry.attempts=${KAFKA_RETRY_ATTEMPTS:3}
audit.kafka.retry.interval-ms=${KAFKA_RETRY_INTERVAL_MS:1000}
audit.kafka.partitions=3
# 1 en local; 3 en el cluster de AWS (3 brokers).
audit.kafka.replicas=${KAFKA_TOPIC_REPLICAS:1}

# --- Seguridad: AWS Cognito (mismo User Pool que catalog, reservations y BFF) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${COGNITO_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID:CHANGE_ME}
cognito.app-client-id=${COGNITO_APP_CLIENT_ID:CHANGE_ME}

# --- CORS (origen del frontend Angular; varios separados por coma) ---
cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}

# --- Actuator: health para Docker/EC2 y metricas para Prometheus (Entrega 3) ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

logging.level.org.springframework.security=INFO
logging.level.cl.duoc.andesstay.audit=DEBUG
